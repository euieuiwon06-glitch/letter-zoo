<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@1,600&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f4a2a;
    --pill:#f6efe1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#8fc3ea;
    font-family:"Cinzel","Trajan Pro",serif;
    -webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .9s ease}
  .bg.on{opacity:1}
  #stage{position:fixed;inset:0;pointer-events:none}
  .lt{
    position:absolute;left:0;top:0;
    transform-origin:0 0;
  }
  .lt > span{
    position:absolute;display:block;
    font-weight:600;line-height:1;white-space:pre;
  }
  .grp{position:absolute;inset:0}
  .grp .lt>span{pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
  body.dragging,body.dragging .grp .lt>span{cursor:grabbing}
  #animal{position:absolute;inset:0}
  /* globe button (opens the background picker) */
  #globeBtn{
    position:fixed;top:clamp(14px,1.6vw,28px);right:clamp(14px,1.6vw,28px);z-index:30;
    width:clamp(38px,2.9vw,50px);height:clamp(38px,2.9vw,50px);border-radius:50%;
    display:grid;place-items:center;border:0;cursor:pointer;padding:0;
    background:none;color:var(--ink);
    transition:transform .2s;
  }
  #globeBtn:hover{transform:scale(1.06)}
  #globeBtn svg{width:100%;height:100%;display:block}
  #globeBtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* background picker: blurred screen + sliding cards */
  #picker{
    position:fixed;inset:0;z-index:20;overflow:hidden;
    background:rgba(30,26,24,.12);
    -webkit-backdrop-filter:blur(18px) saturate(1.05);backdrop-filter:blur(18px) saturate(1.05);
    opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  #picker.open{opacity:1;pointer-events:auto}
  .track{
    position:absolute;left:0;top:47%;display:flex;gap:var(--gap);
    --cw:min(51vw,calc(56vh * 1.98));--gap:max(28px,6vw);
    transform:translate(0,-50%);touch-action:pan-y;cursor:grab;
  }
  .track.anim{transition:transform .55s cubic-bezier(.22,1,.36,1)}
  body.dragging-track .track{cursor:grabbing}
  .card{
    position:relative;flex:none;width:var(--cw);aspect-ratio:1.98;
    border-radius:clamp(14px,1.4vw,22px);overflow:hidden;
    box-shadow:0 30px 60px -36px rgba(0,0,0,.55);
    -webkit-user-select:none;user-select:none;
  }
  .card img{width:100%;height:100%;object-fit:cover;object-position:center 80%;display:block;pointer-events:none}
  .card::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
  .card.prev::after{opacity:1;background:linear-gradient(90deg,rgba(0,0,0,.5) 30%,rgba(0,0,0,.18) 75%,rgba(0,0,0,.04))}
  .card.next::after{opacity:1;background:linear-gradient(270deg,rgba(0,0,0,.5) 30%,rgba(0,0,0,.18) 75%,rgba(0,0,0,.04))}
  .card:not(.active){cursor:pointer}
  #bar{z-index:25}
  @media (max-width:700px){ .track{--cw:78vw;--gap:7vw} }

  #bar{
    position:fixed;left:50%;top:92%;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:clamp(8px,.8vw,14px);
  }
  form{width:clamp(220px,26vw,520px)}
  input{
    width:100%;border:0;outline:0;
    height:clamp(38px,3vw,62px);
    border-radius:999px;
    background:var(--pill);
    color:var(--ink);caret-color:var(--ink);
    font:500 clamp(13px,1vw,21px)/1 "Noto Sans KR",sans-serif;
    letter-spacing:.09em;text-transform:uppercase;
    padding:0 clamp(16px,1.9vw,40px);
    box-shadow:0 10px 30px -18px rgba(20,50,20,.45);
  }
  input::placeholder{color:rgba(31,74,42,.38)}
  input:focus-visible{box-shadow:0 0 0 3px rgba(31,74,42,.25),0 10px 30px -18px rgba(20,50,20,.45)}
  form.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* "ANIMALS" button next to the input */
  #openIntro{
    display:inline-flex;align-items:center;justify-content:center;gap:.6em;flex:none;
    height:clamp(38px,3vw,62px);padding:0 clamp(18px,1.6vw,32px);
    border:0;border-radius:999px;cursor:pointer;
    background:var(--pill);color:var(--ink);
    font:500 clamp(13px,1vw,21px)/1 "Noto Sans KR",sans-serif;letter-spacing:.09em;
    box-shadow:0 10px 30px -18px rgba(20,50,20,.45);
  }
  /* label + arrow behave as one group, centred in the pill:
     the label box is trimmed to the capital height so it centres like the icon */
  #openIntro .lbl{display:block;text-box:trim-both cap alphabetic;margin-right:-.09em}
  #openIntro svg{display:block;width:.74em;height:.74em;flex:none}
  #openIntro:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* intro popup — panel keeps the reference ratio (991 x 419); inside sizes are in panel-width units */
  #intro{
    position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-end;
    padding:16px 16px calc(100vh * (1 - .803) - 3.2vh);
    opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  #intro.open{opacity:1;pointer-events:auto}
  .panel{
    position:relative;container-type:inline-size;
    width:min(1180px,92vw,calc((80.3vh - 48px) / .52));
    padding:1.3cqw 0 3.6cqw;
    border-radius:4.2cqw;
    background:rgba(255,255,255,.17);
    -webkit-backdrop-filter:blur(13px) saturate(1.1);backdrop-filter:blur(13px) saturate(1.1);
    box-shadow:0 30px 70px -45px rgba(20,40,30,.5);
    color:var(--ink);text-align:center;
    transform:translateY(10px) scale(.985);transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  #intro.open .panel{transform:none}
  .panel h2{
    font:italic 600 3.05cqw/1.15 "EB Garamond",serif;
    margin:0 8cqw;
  }
  .panel .x{
    position:absolute;top:1.9cqw;right:3.6cqw;
    width:4.4cqw;height:4.4cqw;display:grid;place-items:center;
    border:0;background:none;color:var(--ink);cursor:pointer;border-radius:50%;
  }
  .panel .x svg{width:2.9cqw;height:2.9cqw}
  .panel .x:focus-visible{outline:2px solid var(--ink)}
  .grid{
    width:82.8cqw;margin:4.6cqw auto 0;
    display:grid;grid-template-columns:repeat(5,1fr);row-gap:5cqw;
  }
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.75cqw}
  .tile .ic{height:6.4cqw;display:flex;align-items:flex-end}
  .tile svg{display:block;fill:var(--ink)}
  .tile b{font:700 1.5cqw/1 "Cinzel",serif;letter-spacing:.09em}

  /* narrow screens: the fixed ratio would make everything tiny, so let it grow taller */
  @media (max-width:700px){
    .panel{width:92vw;padding:5cqw 4cqw 4cqw;border-radius:7cqw}
    .panel h2{font-size:6cqw;margin:0 9cqw 5cqw}
    .panel .x{top:3.5cqw;right:4cqw;width:9cqw;height:9cqw}
    .panel .x svg{width:6cqw;height:6cqw}
    .grid{width:auto;margin:0;grid-template-columns:repeat(3,1fr);row-gap:8cqw}
    .tile .ic{height:auto}
    .tile{gap:1.6cqw}
    .tile b{font-size:3.3cqw}
  }
  @media (prefers-reduced-motion:reduce){
    .lt{transition:none!important}
  }
</style>
</head>
<body>
<div id="bgs"></div>
<div id="stage">
  <div id="animal"></div>
</div>

<script>
/* ------------------------------------------------------------------
   LETTER ZOO — animals composed only of letters
   (each letter: position, rotation, size. Nothing else.)
   Units: ground is y=0, up is negative y. Animals face right.
------------------------------------------------------------------- */
const FONT = '600 100px "Cinzel"';
const metricCache = {};
let ctx;
function M(ch){
  if (metricCache[ch]) return metricCache[ch];
  if (!ctx){ ctx = document.createElement('canvas').getContext('2d'); }
  ctx.font = FONT;
  const m = ctx.measureText(ch);
  const fa = m.fontBoundingBoxAscent ?? 101, fd = m.fontBoundingBoxDescent ?? 30;
  const base = (100 - (fa + fd)) / 2 + fa;                 // baseline inside a line-height:1 box
  const top = base - m.actualBoundingBoxAscent;
  const bot = base + m.actualBoundingBoxDescent;
  const left = -m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight;
  return metricCache[ch] = {
    cx:(left+right)/200, cy:(top+bot)/200,
    w:(right-left)/100, h:(bot-top)/100
  };
}

/* ---------- builder API ---------- */
function makeAPI(parts){
  const api = {
    g(ch,x,y,s,r=0,col='#000'){ parts.push({ch,x,y,s,r,col}); },
    // glyph standing on line gy (bottom of glyph touches it)
    stand(ch,x,s,r=0,col='#000',gy=0){ parts.push({ch,x,y:gy - M(ch).h*s/2,s,r,col}); },
    // long thin leg: letters stacked on top of each other
    leg(ch,x,n,s,col,tilt=0){ const h=M(ch).h*s*0.96; for(let i=0;i<n;i++) parts.push({ch,x:x+Math.sin(tilt*Math.PI/180)*h*(i+.5),y:-h*(i+.5)-M(ch).h*s*0.02,s,r:tilt,col}); },
    // letters radiating around a centre, their "up" pointing outward
    ring(chars,cx,cy,rad,s,cols,a0=0,a1=360,n){
      n = n || chars.length;
      const full = Math.abs(a1-a0) >= 359.9;
      for (let i=0;i<n;i++){
        const t = full ? i/n : (n===1?0.5:i/(n-1));
        const a = a0 + (a1-a0)*t, rad2 = a*Math.PI/180;
        parts.push({ch:chars[i%chars.length], x:cx+rad*Math.cos(rad2), y:cy+rad*Math.sin(rad2), s:Array.isArray(s)?s[i%s.length]:s, r:a+90, col:cols[i%cols.length]});
      }
    },
    // letters spaced along a polyline; tangent=true turns each letter's baseline along the path
    path(chars,pts,s,cols,{tangent=true,extra=0,n}={}){
      n = n || chars.length;
      const seg=[];let L=0;
      for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d;}
      for(let i=0;i<n;i++){
        let d = n===1?L/2:L*i/(n-1), k=0;
        while(k<seg.length-1 && d>seg[k]){d-=seg[k];k++;}
        const t = seg[k]?Math.min(1,d/seg[k]):0;
        const [x0,y0]=pts[k],[x1,y1]=pts[k+1];
        const ang = Math.atan2(y1-y0,x1-x0)*180/Math.PI;
        const size = typeof s==='function'?s(i,n):s;
        parts.push({ch:chars[i%chars.length],x:x0+(x1-x0)*t,y:y0+(y1-y0)*t,s:size,r:(tangent?ang:0)+extra,col:cols[i%cols.length]});
      }
    },
    // smooth curve helper (quadratic bezier sampled to polyline)
    quad(p0,p1,p2,steps=24){
      const out=[];for(let i=0;i<=steps;i++){const t=i/steps,u=1-t;
        out.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}
      return out;
    }
  };
  return api;
}

/* unknown word → a creature built from its own letters */
function generic(word){
  const pals=[{a:'#b07a4c',b:'#6e4a2c'},{a:'#7f8a5a',b:'#4a5534'},{a:'#9a6b8a',b:'#5e3d55'},{a:'#c48a3a',b:'#7a5220'},{a:'#6e7f95',b:'#3f4c5e'}];
  let h=0;for(const ch of word)h=(h*31+ch.charCodeAt(0))>>>0;
  const c={...pals[h%pals.length],d:'#1f1a16'};
  const L=word.toUpperCase().replace(/[^A-Z]/g,'')||'ZOO';
  return {scale:.85,c,draw({g,stand},c){
    const n=L.length, sz=Math.max(150,260-n*10), step=sz*.52, x0=-(n-1)*step/2-60;
    g(L[n-1],x0-sz*.55,-300,sz*.9,-30,c.b);                    // tail = last letter
    stand('I',x0+10,260,0,c.b); stand('I',x0+65,260,0,c.a);
    stand('I',x0+(n-1)*step-40,260,0,c.b); stand('I',x0+(n-1)*step+15,260,0,c.a);
    for(let i=0;i<n;i++) g(L[i],x0+i*step,-225-Math.sin(i/(n-1||1)*Math.PI)*24,sz,(i%2?4:-4),c.a); // body
    const hx=x0+(n-1)*step+sz*.7;
    g('I',hx-50,-300,190,30,c.a);
    g(L[0],hx,-370,sz*1.05,0,c.a);                             // head = first letter
    g('A',hx-40,-370-sz*.55,80,-15,c.b); g('A',hx+40,-370-sz*.55,80,15,c.b);
    g('O',hx+20,-380,26,0,c.d);
  }};
}

/* ---------- rendering ---------- */
const $animal=document.getElementById('animal');
const $q=document.getElementById('q'),$f=document.getElementById('f');
const params=new URLSearchParams(location.search);
const STATIC=params.has('static');

function compose(spec,palette){
  const parts=[];spec.draw(makeAPI(parts),{...spec.c,...(palette||{})});
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const p of parts){
    const m=M(p.ch),hw=m.w*p.s/2,hh=m.h*p.s/2,a=p.r*Math.PI/180,ca=Math.abs(Math.cos(a)),sa=Math.abs(Math.sin(a));
    const ex=hw*ca+hh*sa,ey=hw*sa+hh*ca;
    x0=Math.min(x0,p.x-ex);x1=Math.max(x1,p.x+ex);y0=Math.min(y0,p.y-ey);y1=Math.max(y1,p.y+ey);
  }
  return {parts,box:{x0,x1,y0,y1}};
}

function el(p,k){
  const m=M(p.ch),fs=p.s*k;
  const d=document.createElement('div');d.className='lt';
  const s=document.createElement('span');s.textContent=p.ch;
  s.style.fontSize=fs+'px';s.style.color=p.col;
  s.style.left=(-m.cx*fs)+'px';s.style.top=(-m.cy*fs)+'px';
  d.appendChild(s);
  return d;
}
const T=(x,y,r,sc=1,fx=1)=>`translate(${x}px,${y}px) rotate(${r}deg) scale(${sc*fx},${sc})`;

/* day / night backgrounds: horizon = where the field starts (fraction of height) */
const SCENES={day:{horizon:.803},night:{horizon:.803},valley:{horizon:.800},cloudy:{horizon:.752}};
let scene='day';
function layout(){
  const W=innerWidth,H=innerHeight;
  const gy=H*(SCENES[scene].horizon+.015);
  const base=Math.min(W/1380,H/860);
  return {W,H,gy,base,narrow:W<760};
}

function resolve(word){
  let w=word.toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return null;
  let key=w, pal=null;
  if(!ANIMALS[key] && VARIANTS[key]){const v=VARIANTS[key]; if(Array.isArray(v)){key=v[0];pal=v[1];}else key=v;}
  if(!ANIMALS[key] && key.endsWith('s') && ANIMALS[key.slice(0,-1)]) key=key.slice(0,-1);
  if(ANIMALS[key]) return {spec:ANIMALS[key],pal,known:true,word:w};
  return {spec:generic(w),pal:null,known:false,word:w};
}

/* every creature on screen = one item {r, ax (0..1 of width), off, sc, grp, cx, cy} */
const items=[];
/* place a new creature where it overlaps the others least, near the centre, fully on screen */
function pickSlot(w,fl){
  if(w>=.96) return .5;
  let best=.5,bs=Infinity;
  for(let c=w/2+.015;c<=1-w/2-.015;c+=.005){
    let ov=0;
    for(const it of items){
      if(!!it.r.spec.float!==fl) continue;
      const ci=it.ax+it.off.x/innerWidth, wi=it.w*it.sc;
      ov+=Math.max(0,(w+wi)/2-Math.abs(c-ci));
    }
    const sc=ov*10+Math.abs(c-.5)*.3;
    if(sc<bs){bs=sc;best=c;}
  }
  return best;
}
function applyTransform(it){
  it.grp.style.transform=`translate(${it.off.x}px,${it.off.y}px)`;
}

function fit(r,L){
  const {parts,box}=compose(r.spec,r.pal);
  const bw=box.x1-box.x0,bh=box.y1-box.y0;
  let k=L.base*(r.spec.scale||1)*.72;
  const maxH=r.spec.float?L.gy*.42:L.gy*.6, maxW=L.W*(L.narrow?.7:.34);
  k=Math.min(k,maxH/bh,maxW/bw);
  return {parts,box,k,w:bw*k/L.W};
}
function build(it,animate){
  const L=layout(), r=it.r;
  const f=fit(r,L), {parts,box,w}=f; it.w=w;
  const ax=L.W*it.ax, cx=(box.x0+box.x1)/2;
  const k0=f.k, lift=r.spec.float?(r.spec.float*k0):0;
  const py0=y=>r.spec.float? (L.gy-lift+(y-box.y1)*k0) : (L.gy+y*k0);
  const pivY=(py0(box.y0)+py0(box.y1))/2;      // resize pivot = centre of the creature
  // size changes redraw the letters at their real font size (crisp vector text, no bitmap scaling)
  const sc=it.sc, k=k0*sc, py=y=>pivY+(py0(y)-pivY)*sc;

  if(!it.grp){it.grp=document.createElement('div');it.grp.className='grp';it.grp._item=it;$animal.appendChild(it.grp);}
  it.grp.innerHTML='';
  applyTransform(it);

  const rect=$f.getBoundingClientRect(),ix=rect.left+rect.width*.3,iy=rect.top+rect.height/2;
  const nodes=parts.map(p=>{
    // flipped = true mirror image: mirrored position, negated rotation, mirrored glyph
    const fx=it.flip?-1:1, X=ax+fx*(p.x-cx)*k, Y=py(p.y), R=fx*p.r, d=el(p,k);
    if(animate&&!STATIC){
      d.style.opacity='0';
      d.style.transform=T(ix+(Math.random()-.5)*rect.width*.6,iy+(Math.random()-.5)*30,(Math.random()-.5)*360,.15);
    }else d.style.transform=T(X,Y,R,1,fx);
    it.grp.appendChild(d);return [d,X,Y,R,fx];
  });
  if(animate&&!STATIC){
    it.grp.offsetWidth; // reflow
    nodes.forEach(([d,X,Y,R,fx],i)=>{
      const dl=i*26+Math.random()*60;
      d.style.transition=`transform 1.1s cubic-bezier(.2,1.3,.35,1) ${dl}ms, opacity .35s ease-out ${dl}ms`;
      d.style.transform=T(X,Y,R,1,fx);d.style.opacity='1';
    });
  }
}

function add(word){
  const r=resolve(word); if(!r) return false;
  const w=fit(r,layout()).w;
  const it={r,w,ax:pickSlot(w,!!r.spec.float),off:{x:0,y:0},sc:1,grp:null};
  items.push(it); build(it,true);
  if(!r.known){$f.classList.remove('shake');void $f.offsetWidth;$f.classList.add('shake');}
  return true;
}
function relayout(){ items.forEach(it=>build(it,false)); }

/* ---------- press & hold: drag to move, wheel to resize ---------- */
let drag=null, lastTap={};
$animal.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const g=e.target.closest('.grp'); if(!g) return;
  e.preventDefault();
  const it=g._item;
  // double-click (two presses on the same creature within 350ms): mirror left/right
  const now=performance.now();
  if(lastTap.it===it && now-lastTap.t<350 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<10){
    it.flip=!it.flip; build(it,false); lastTap={};
  } else lastTap={it,t:now,x:e.clientX,y:e.clientY};
  if($animal.lastElementChild!==g) $animal.appendChild(g);   // bring to front
  drag={it,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:it.off.x,oy:it.off.y};
  document.body.classList.add('dragging');
  try{e.target.setPointerCapture(e.pointerId);}catch(_){}
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  drag.it.off={x:drag.ox+e.clientX-drag.sx,y:drag.oy+e.clientY-drag.sy};
  applyTransform(drag.it);
});
const endDrag=e=>{ if(drag&&e.pointerId===drag.id){drag=null;document.body.classList.remove('dragging');} };
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('wheel',e=>{
  if(!drag) return;
  e.preventDefault();
  const it=drag.it;
  it.sc=Math.min(5,Math.max(.15,it.sc*Math.exp(-e.deltaY*.0015)));   // wheel up = bigger, down = smaller
  if(!it.raf) it.raf=requestAnimationFrame(()=>{it.raf=0;build(it,false);});
},{passive:false});

/* hold + Delete key: remove */
addEventListener('keydown',e=>{
  if(!drag||e.key!=='Delete') return;
  e.preventDefault();
  const it=drag.it; drag=null; document.body.classList.remove('dragging');
  items.splice(items.indexOf(it),1);
  [...it.grp.children].forEach((d,i)=>{
    d.style.transition=`transform .45s ease-in ${i*4}ms, opacity .35s ease-in ${i*4}ms`;
    d.style.transform+=' scale(.2)'; d.style.opacity='0';
  });
  it.grp.querySelectorAll('span').forEach(s=>s.style.pointerEvents='none');
  setTimeout(()=>it.grp.remove(),700);
});

/* ---------- backgrounds: globe button opens a sliding picker ---------- */
const BGS=[{id:'day',src:'bg.jpg',label:'Day'},{id:'night',src:'bg-night.jpg',label:'Sunset'},
           {id:'valley',src:'bg-valley.jpg',label:'Valley'},{id:'cloudy',src:'bg-cloudy.jpg',label:'Cloudy field'}];
const $bgs=document.getElementById('bgs');
// each layer is positioned so its field line lands at the same fraction of the screen as in the photo
$bgs.innerHTML=BGS.map(b=>`<div class="bg${b.id===scene?' on':''}" data-id="${b.id}" style="background-image:url('${b.src}');background-position:center ${SCENES[b.id].horizon*100}%"></div>`).join('');
function setScene(id){
  if(id===scene) return;
  scene=id;
  [...$bgs.children].forEach(l=>l.classList.toggle('on',l.dataset.id===id));
  relayout();                                   // creatures stay standing on the new field line
}
const $picker=document.getElementById('picker'), $track=$picker.querySelector('.track'), $globe=document.getElementById('globeBtn');
$track.innerHTML=BGS.map((b,i)=>`<div class="card" data-i="${i}" role="button" tabindex="-1" aria-label="${b.label}"><img src="${b.src}" alt="" draggable="false"></div>`).join('');
const cards=[...$track.children];
let cur=0;
function trackX(i){
  const cw=cards[0].getBoundingClientRect().width, gap=parseFloat(getComputedStyle($track).columnGap)||0;
  return innerWidth/2-(i*(cw+gap)+cw/2);
}
function showCard(i,{animate=true,apply=true}={}){
  cur=Math.max(0,Math.min(BGS.length-1,i));
  $track.classList.toggle('anim',animate);
  $track.style.transform=`translate(${trackX(cur)}px,-50%)`;
  cards.forEach((c,k)=>{c.classList.toggle('active',k===cur);c.classList.toggle('prev',k<cur);c.classList.toggle('next',k>cur);});
  if(apply) setScene(BGS[cur].id);               // the page behind follows the card in the middle
}
function openPicker(){
  showCard(BGS.findIndex(b=>b.id===scene),{animate:false,apply:false});
  $picker.classList.add('open');$globe.setAttribute('aria-expanded','true');
}
function closePicker(){
  if(!$picker.classList.contains('open')) return;
  $picker.classList.remove('open');$globe.setAttribute('aria-expanded','false');
}
$globe.addEventListener('click',()=>$picker.classList.contains('open')?closePicker():openPicker());
$picker.addEventListener('click',e=>{ if(e.target===$picker) closePicker(); });   // empty space = back to the page
// swipe / drag the cards left and right
let tdrag=null;
$track.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  tdrag={id:e.pointerId,sx:e.clientX,x0:trackX(cur),moved:false,card:e.target.closest('.card')};
  $track.classList.remove('anim');document.body.classList.add('dragging-track');
  $track.setPointerCapture(e.pointerId);
});
$track.addEventListener('pointermove',e=>{
  if(!tdrag||e.pointerId!==tdrag.id) return;
  let dx=e.clientX-tdrag.sx;
  if(Math.abs(dx)>4) tdrag.moved=true;
  const edge=(cur===0&&dx>0)||(cur===BGS.length-1&&dx<0);   // rubber-band at the ends
  if(edge) dx*=.35;
  $track.style.transform=`translate(${tdrag.x0+dx}px,-50%)`;
});
const endTrack=e=>{
  if(!tdrag||e.pointerId!==tdrag.id) return;
  const dx=e.clientX-tdrag.sx, cw=cards[0].getBoundingClientRect().width, t=tdrag; tdrag=null;
  document.body.classList.remove('dragging-track');
  if(t.moved && Math.abs(dx)>cw*.15) showCard(cur+(dx<0?1:-1));
  else if(!t.moved && t.card){ const i=+t.card.dataset.i; if(i===cur) closePicker(); else showCard(i); }
  else if(!t.moved) closePicker();               // tap in the gap between cards = empty space
  else showCard(cur,{apply:false});
};
$track.addEventListener('pointerup',endTrack);$track.addEventListener('pointercancel',endTrack);
addEventListener('keydown',e=>{
  if(!$picker.classList.contains('open')) return;
  if(e.key==='ArrowRight'){e.preventDefault();showCard(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();showCard(cur-1);}
  else if(e.key==='Escape') closePicker();
});
addEventListener('resize',()=>{ if($picker.classList.contains('open')) showCard(cur,{animate:false,apply:false}); });

$f.addEventListener('submit',e=>{
  e.preventDefault();
  if(add($q.value)) $q.value='';
});

const MENU=['rabbit','cat','dog','deer','bear','fox','horse','elephant','giraffe','lion','tiger','sheep','duck','owl','eagle'];
const $intro=document.getElementById('intro'), $grid=$intro.querySelector('.grid');
function buildMenu(){
  // 1 reference px = 100/991 cqw, so every silhouette keeps its size relative to the panel
  const narrow=matchMedia('(max-width:700px)').matches, u=narrow?.21:.9*100/991;
  $grid.innerHTML=MENU.map(w=>{
    const v=SIL[w];
    return `<div class="tile"><div class="ic"><svg viewBox="0 0 ${v.w} ${v.h}" style="width:${v.w*u}cqw;height:${v.h*u}cqw" aria-hidden="true"><path d="${v.d}"/></svg></div><b>${w.toUpperCase()}</b></div>`;
  }).join('');
}
buildMenu();
matchMedia('(max-width:700px)').addEventListener('change',buildMenu);
function openIntro(){ $intro.classList.add('open'); if(document.activeElement===$q) $q.blur(); }
function closeIntro(){ if(!$intro.classList.contains('open')) return; $intro.classList.remove('open'); if(!matchMedia('(pointer:coarse)').matches) $q.focus(); }
document.getElementById('openIntro').addEventListener('click',openIntro);
$intro.querySelector('.x').addEventListener('click',closeIntro);
$intro.addEventListener('click',e=>{ if(e.target===$intro) closeIntro(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') closeIntro(); });

Promise.race([document.fonts.load(FONT,'ABCDEFGHIJKLMNOPQRSTUVWXYZ'),new Promise(r=>setTimeout(r,2500))])
  .then(()=>document.fonts.ready).then(()=>{
    (params.get('a')||'').split(',').filter(Boolean).forEach(add);   // ?a=lion,cat only for previews
    if(params.get('m')&&SCENES[params.get('m')]) setScene(params.get('m'));
    // first visit shows the plain page only; the guide opens from the ANIMALS button
    if(params.has('intro')) openIntro();
  });
</script>
